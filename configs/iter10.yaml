# Fixed 10-task iteration set for developing gate prompts + studying error
# propagation. Same design as configs/base.yaml; the ONLY cross-condition variable
# is still gate presence. Tasks are PINNED via task_ids so re-curation / reordering
# can never change the set — reproducible across iterations.
#
# The 10 tasks: 5 call-based (LeetCode) + 5 stdin (AtCoder), all "hard", all with
# >=40 total tests (>=3 public), spanning both harness graders and both prompt
# variants. AtCoder/stdin problems carry most of the expected failures.
#
# NOTE: this set was chosen on principle (format balance + discriminating hidden
# eval), NOT yet validated for o3-mini's per-task failure rate. If a pilot shows
# some of these are always-pass or always-fail, swap them for tasks whose hidden
# pass rate lands in the middle (~20-80%) — that's where gates/propagation show up.

experiment:
  name: "supervision-checkpoints-iter10"
  seed: 7
  condition: "none"            # overridden per-condition by the batch sweep
  trials: 3

model:
  provider: "openai"
  name: "o3-mini"
  reasoning_effort: "low"      # weaker first attempts -> more defects to study
  max_completion_tokens: 32768

loop:
  max_iterations: 6
  plan_gate_max_retries: 2
  final_gate_max_retries: 2

execution:
  timeout: 6
  per_test: true

dataset:
  release_version: "release_v5"
  contamination_start_date: "2023-11-01"   # o3-mini cutoff 2023-10-01 + 1mo buffer
  contamination_end_date: null
  difficulty: ["hard"]
  # Pinned iteration set. When task_ids is set, max_tasks is ignored.
  task_ids:
    - "3552"        # find-the-largest-palindrome-divisible-by-k   (LeetCode, 3 pub / 40 priv)
    - "3550"        # maximum-value-sum-by-placing-three-rooks      (LeetCode, 3 pub / 40 priv)
    - "3548"        # find-the-count-of-good-integers               (LeetCode, 3 pub / 40 priv)
    - "3580"        # find-the-occurrence-of-first-almost-equal     (LeetCode, 4 pub / 40 priv)
    - "3608"        # find-the-number-of-subsequences-with-equal    (LeetCode, 3 pub / 40 priv)
    - "abc374_e"    # Sensor Optimization Dilemma 2                 (AtCoder,  4 pub / 40 priv)
    - "abc375_e"    # 3 Team Division                               (AtCoder,  4 pub / 48 priv)
    - "abc377_e"    # Permute K times 2                             (AtCoder,  3 pub / 47 priv)
    - "abc384_f"    # Double Sum 2                                  (AtCoder,  3 pub / 40 priv)
    - "arc185_c"    # Sum of Three Integers                         (AtCoder,  3 pub / 40 priv)
  max_tasks: 10                # ignored while task_ids is set; documents intended size
  cache_path: null             # reuses curated_release_v5_hard_from-2023-11-01.jsonl

logging:
  dir: "logs/iter10"           # separate dir so this set never mixes with other runs
